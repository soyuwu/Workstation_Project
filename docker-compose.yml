version: '3.8'
services:
  app:
    build: .
    container_name: workstation-app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    networks:
      - workstation-network

  db:
    image: mysql:8.0
    container_name: workstation-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: workstation_db
      MYSQL_ROOT_PASSWORD: your_strong_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - workstation-network

  nginx:
    image: nginx:alpine
    container_name: workstation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - workstation-network

networks:
  workstation-network:
    driver: bridge
volumes:
  dbdata: