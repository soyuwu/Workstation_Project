server {
    listen 80;
    server_name workstation.io.vn;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;
    return 301 https://$server_name$request_uri;
    # Hỗ trợ nhận diện các file tĩnh đã được Vite build
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Chuyển tiếp các file PHP sang container 'app' xử lý
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

server {
    listen 443 ssl;
    server_name workstation.io.vn www.workstation.io.vn;

    index index.php index.html;
    root /var/www/public;

    # Đường dẫn chứng chỉ SSL (Lưu ý: Bạn phải ánh xạ volume này trong docker-compose.yml)
    ssl_certificate /etc/letsencrypt/live/workstation.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workstation.io.vn/privkey.pem;

    # Cấu hình bảo mật SSL tiêu chuẩn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Hỗ trợ nhận diện các file tĩnh đã được Vite build
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Chuyển tiếp các file PHP sang container 'app' xử lý
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Chặn truy cập vào các file ẩn như .env hoặc .git
    location ~ /\.(?!well-known).* {
        deny all;
    }
}